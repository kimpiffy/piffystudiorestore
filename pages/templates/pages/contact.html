{% extends "base.html" %}
{% load static %}

{% block title %}contact{% endblock %}
{% block body_class %}contact-body{% endblock %}

{% block extra_head %}
<link rel="stylesheet" href="{% static 'css/contact.css' %}">
{% endblock %}

{% block content %}
<main class="contact-page">
  <!-- Intro animation: tiny pink blob that expands -->
  <div class="intro-stage" id="introStage">
    <div class="expanding-blob" id="expandingBlob">
      <svg class="blob-svg" viewBox="0 0 100 100" preserveAspectRatio="none" aria-hidden="true">
        <path id="introBlobPath" class="intro-blob-fill" d=""></path>
      </svg>
    </div>
  </div>

  <!-- Tessellating dots background (hidden initially) -->
  <div class="tessellated-bg" id="tessellatedBg"></div>

  <!-- Main contact form (hidden initially) -->
  <section class="contact-content" id="contactContent" aria-label="contact form">
    <div class="contact-form-wrap">
      <div class="contact-inner">
        <h1 class="contact-title">contact</h1>

        <form
          class="contact-form"
          method="POST"
          action="https://formspree.io/f/xreleywk"
          novalidate
        >
          <input type="hidden" name="source_site" value="piffystudio">
          <input type="hidden" name="_subject" value="New contact – Piffystudio">
          <input type="text" name="_gotcha" class="honeypot" tabindex="-1" autocomplete="off" aria-hidden="true">

          <div class="field-grid">
            <div class="field">
              <label for="full_name">Full Name *</label>
              <input id="full_name" name="full_name" type="text" required autocomplete="name" placeholder="Full Name *">
            </div>

            <div class="field">
              <label for="email">Email *</label>
              <input id="email" name="email" type="email" required autocomplete="email" placeholder="Email *">
            </div>

            <div class="field">
              <label for="telephone">Telephone</label>
              <input id="telephone" name="telephone" type="tel" autocomplete="tel" placeholder="Telephone">
            </div>

            <div class="field">
              <label for="location">Location</label>
              <input id="location" name="location" type="text" autocomplete="address-level2" placeholder="Location">
            </div>

            <div class="field field-full">
              <label for="query_related">Query Related To *</label>
              <select id="query_related" name="query_related" required>
                <option value="" selected disabled>Choose One:</option>
                <option value="art">Art</option>
                <option value="web design">Web Design</option>
                <option value="community projects">Community Projects</option>
                <option value="creative facilitation">Creative Facilitation</option>
                <option value="collaboration">Collaboration</option>
                <option value="other">Other</option>
              </select>
            </div>

            <div class="field field-full is-hidden" id="otherWrap">
              <label for="other_specify">Please Specify *</label>
              <input id="other_specify" name="other_specify" type="text" placeholder="Please Specify *">
            </div>

            <div class="field field-full">
              <label for="message">Message *</label>
              <textarea id="message" name="message" rows="6" required placeholder="Message *"></textarea>
            </div>

            <div class="field field-full checkbox-row">
              <label class="checkbox">
                <input id="newsletter" name="newsletter" type="checkbox" value="yes">
                <span class="checkbox-box" aria-hidden="true"></span>
                <span class="checkbox-text">Sign up for Newsletter? *</span>
              </label>
            </div>
          </div>

          <div class="actions">
            <button class="contact-btn" type="submit">send</button>
          </div>
        </form>
      </div>
    </div>
  </section>
</main>
{% endblock %}

{% block extra_scripts %}
<script src="{% static 'js/contact.js' %}"></script>
{% endblock %}
