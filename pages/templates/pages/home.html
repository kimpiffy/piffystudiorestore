{% load static %}
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>Piffy Studio</title>

  <!-- Homepage-only styles -->
  <link rel="stylesheet" href="{% static 'css/home.css' %}">
</head>

<body class="home">

  <main class="tiles">

    <!-- CREATING -->
    <a
      class="tile"
      href="{% url 'portfolio:art' %}"
      style="--bg: url('{% static 'img/create.png' %}');"
    >
      <div class="tile__bg" aria-hidden="true"></div>
      <div class="tile__word" data-text="create"></div>
    </a>

    <!-- BUILDING -->
    <a
      class="tile"
      href="{% url 'portfolio:digital' %}"
      style="--bg: url('{% static 'img/build.png' %}');"
    >
      <div class="tile__bg" aria-hidden="true"></div>
      <div class="tile__word" data-text="build"></div>
    </a>

    <!-- CONNECTING -->
    <a
      class="tile"
      href="{% url 'portfolio:installations' %}"
      style="--bg: url('{% static 'img/connect.jpg' %}');"
    >
      <div class="tile__bg" aria-hidden="true"></div>
      <div class="tile__word" data-text="connect"></div>
    </a>

  </main>

<script src="{% static 'js/vendor/blotter.min.js' %}"></script>
<script src="{% static 'js/vendor/liquidDistortMaterial.js' %}"></script>
<script src="{% static 'js/home-blotter.js' %}"></script>
<script src="{% static 'js/home-snap.js' %}"></script>

</body>
</html>
