{% extends "base.html" %}
{% load static %}

{% block body_class %}about-page{% endblock %}

{% block extra_head %}
<link rel="stylesheet" href="{% static 'css/about.css' %}">
{% endblock %}

{% block content %}
<div class="about-stage" id="aboutStage"
  data-url-art="{% url 'portfolio:art' %}"
  data-url-digital="{% url 'portfolio:digital' %}"
  data-url-community="{% url 'portfolio:installations' %}"
  data-url-cv="{% static 'kimpiffycv.pdf' %}"
>
  <div class="zone bio-zone" id="bioZone"></div>
  <button class="portrait-blob" id="portraitBlob" type="button"></button>
  <div class="zone links-zone" id="linksZone"></div>

  <!-- overlay -->
  <div class="overlay" id="overlay" aria-hidden="true">
    <div class="overlay-backdrop" id="overlayBackdrop"></div>
    <div class="overlay-panel">
      <button class="overlay-close" id="overlayClose" type="button">x</button>
      <div id="overlayContent"></div>
    </div>
  </div>
</div>



  <button class="portrait-blob" id="portraitBlob" type="button" aria-label="Portrait blob"></button>
  <div class="about-words" id="aboutWords"></div>

  <div class="overlay" id="overlay" aria-hidden="true">
    <div class="overlay-backdrop" id="overlayBackdrop"></div>
    <div class="overlay-panel">
      <button class="overlay-close" id="overlayClose" type="button">x</button>
      <div id="overlayContent"></div>
    </div>
  </div>
</div>
{% endblock %}

{% block extra_scripts %}
<script type="module" src="{% static 'js/about/index.js' %}?v=999"></script>
{% endblock %}
