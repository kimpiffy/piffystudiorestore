{% extends "base.html" %}
{% load static %}

{% block body_class %}about-page{% endblock %}

{% block extra_head %}
<link rel="stylesheet" href="{% static 'css/about.css' %}">
{% endblock %}

{% block content %}
<div
  class="about-stage"
  id="aboutStage"
 data-url-art="{% url 'portfolio:art' %}"
data-url-digital="{% url 'portfolio:digital' %}"
data-url-people="{% url 'portfolio:people' %}"
data-url-industry="{% url 'portfolio:industry' %}"
data-url-contact="{% url 'pages:contact' %}"
data-url-cv="{% static 'kimpiffycv.pdf' %}"
>
  <!-- Center blob (stays fixed in middle of viewport) -->
  <button
    class="portrait-blob"
    id="portraitBlob"
    type="button"
    aria-label="Portrait blob"
  ></button>

  <!-- Desktop orbit words layer (JS positions these) -->
  <nav class="orbit" id="aboutWords" aria-label="About navigation">
    <!-- JS can replace/confirm these, but having them in HTML helps SEO + no-JS fallback -->
    <div class="about-word" data-key="bio"><span class="wobble-inner">bio</span></div>
    <div class="about-word" data-key="industry"><span class="wobble-inner">industry</span></div>
    <div class="about-word" data-key="people"><span class="wobble-inner">people</span></div>
    <div class="about-word" data-key="art"><span class="wobble-inner">art</span></div>
    <div class="about-word" data-key="digital"><span class="wobble-inner">digital</span></div>
  </nav>

  <!-- Mobile carousel (one word at a time on curved arc) -->
  <div class="mobile-carousel" id="mobileCarousel" aria-label="About navigation mobile">
    <button class="arrow arrow-left" id="mobilePrev" type="button" aria-label="Previous section">
      ←
    </button>

    <svg class="arc-svg" viewBox="0 0 300 90" aria-hidden="true">
      <path id="mobileArcPath" d="M 30 70 Q 150 10 270 70" fill="none"></path>
      <text class="arc-text">
        <textPath
          href="#mobileArcPath"
          startOffset="50%"
          text-anchor="middle"
          id="mobileArcText"
        >
          bio
        </textPath>
      </text>
    </svg>

    <button class="arrow arrow-right" id="mobileNext" type="button" aria-label="Next section">
      →
    </button>
  </div>

  <!-- Overlay (kept; we’ll decide what opens here in JS) -->
  <div class="overlay" id="overlay" aria-hidden="true">
    <div class="overlay-backdrop" id="overlayBackdrop"></div>

    <div class="overlay-panel" role="dialog" aria-modal="true" aria-label="About details panel">
      <button class="overlay-close" id="overlayClose" type="button" aria-label="Close overlay">
        x
      </button>
      <div id="overlayContent"></div>
    </div>
  </div>
</div>
{% endblock %}

{% block extra_scripts %}
<script type="module" src="{% static 'js/about/index.js' %}?v=999"></script>
{% endblock %}
