<!DOCTYPE html>
<html>
	<head>
		<link href="publication-web-resources/css/main.css?v=2" rel="stylesheet" type="text/css">
		</link>
		<style>
			/* Each exported spread is a fixed 1920x1080 canvas; scale + center it to fit without clipping/scroll. */
			html, body { margin: 0; height: 100%; overflow: hidden; background: transparent; }
			#stage { position: absolute; top: 0; left: 0; width: 100%; height: 100%; overflow: hidden; background: transparent; }
			#stageScaler { position: absolute; top: 0; left: 0; width: 1920px; height: 1080px; transform-origin: 0 0; }
			#contentIFrame { position: absolute; top: 0; left: 0; width: 1920px; height: 1080px; border: none; }
		</style>
		<script src="publication-web-resources/script/main.js" type="text/javascript">
		</script>
	</head>
	<body onload="showHideArrows(); fitStage();">
		<div id="stage">
			<div id="stageScaler">
				<iframe onload="showHideArrows()" id="contentIFrame" src="publication-web-resources/html/publication.html">		</iframe>
			</div>
		</div>
		<iframe id="dummyIFrame" class="dummyIFrameClass">		</iframe>
		<div class="prev" onclick="showPreviousPage()">&lt;</div>
		<div class="next" onclick="showNextPage()">&gt;</div>
		<script>
			function fitStage() {
				var PAGE_W = 1920, PAGE_H = 1080;
				var scale = Math.min(window.innerWidth / PAGE_W, window.innerHeight / PAGE_H);
				var scaler = document.getElementById("stageScaler");
				scaler.style.transform = "scale(" + scale + ")";
				scaler.style.left = ((window.innerWidth - PAGE_W * scale) / 2) + "px";
				scaler.style.top = ((window.innerHeight - PAGE_H * scale) / 2) + "px";
			}
			window.addEventListener("resize", fitStage);
		</script>
