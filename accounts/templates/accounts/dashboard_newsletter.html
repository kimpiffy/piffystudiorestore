{% extends "dashboard_base.html" %}
{% block content %}
<h2>Newsletter</h2>

<p><a href="{% url 'dashboard_newsletter_export_csv' %}">Download CSV</a></p>

<table>
  <thead>
    <tr><th>Email</th><th>Signed up</th><th></th></tr>
  </thead>
  <tbody>
    {% for s in subs_qs %}
    <tr>
      <td>{{ s.email }}</td>
      <td>{{ s.created_at|date:"Y-m-d H:i" }}</td>
      <td>
        <form method="post" action="{% url 'dashboard_newsletter_delete' s.pk %}">
          {% csrf_token %}
          <button type="submit">Delete</button>
        </form>
      </td>
    </tr>
    {% empty %}
    <tr><td colspan="3">No subscribers yet.</td></tr>
    {% endfor %}
  </tbody>
</table>
{% endblock %}
