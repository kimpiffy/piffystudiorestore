{% extends "base.html" %}
{% load static %}

{% block extra_head %}
<link rel="stylesheet" href="{% static 'css/digital.css' %}">
{% endblock %}

{% block body_class %}digital-page{% endblock %}

{% block content %}
<main class="wrap">
  <div class="digital-header">
    <h1 class="visually-hidden">Digital</h1>
    <!-- REMOVE this button entirely -->
    {# <button id="toggleMode" class="top-toggle" type="button" aria-label="View all">View all</button> #}
  </div>

  <section id="modeA" class="mode is-active">
    <div class="showcase" id="showcase">
      <div class="blob-layer" id="blobLayer"></div>

      <div class="nav-arrows" id="navArrows">
        <button id="prevSet" type="button" aria-label="Previous projects">&lt;</button>
        <button id="nextSet" type="button" aria-label="Next projects">&gt;</button>
      </div>
    </div>
  </section>
</main>

<!-- KEEP overlay if you still want click-to-open project info -->
<section id="overlay" class="overlay" aria-hidden="true">
  <div class="overlay-backdrop" id="overlayBackdrop"></div>
  <article class="overlay-panel" id="overlayPanel" role="dialog" aria-modal="true">
    <button id="overlayClose" class="overlay-close" type="button" aria-label="Close">x</button>
    <div id="overlayContent"></div>
  </article>
</section>

{{ projects|json_script:"projects-data" }}
{% endblock %}


{% block extra_scripts %}

<script src="https://cdn.jsdelivr.net/npm/flubber@0.4.2/build/flubber.min.js"></script>
<script type="module" src="/static/js/digital/index.js"></script>

{% endblock %}
