{% extends "base.html" %}
{% load static %}

{% block extra_head %}
<link rel="stylesheet" href="{% static 'css/brand-guidelines.css' %}">
{% endblock %}

{% block body_class %}brand-guidelines-page{% endblock %}

{% block content %}
<section class="guidelines-page" aria-label="Brand guidelines document viewer">
  <div class="guidelines-topbar" aria-label="Brand guidelines actions">
    <p class="guidelines-page-meta" id="pdfPageMeta" aria-live="polite">Loading…</p>
    <a class="guidelines-open" href="{{ pdf_url }}" target="_blank" rel="noopener noreferrer">
      Open in new tab
    </a>
  </div>

  <div class="pdf-stage" aria-label="Brand guidelines page stage">
    <div class="pdf-pages" id="pdfPages" data-pdf-url="{{ pdf_url }}" aria-label="Brand guidelines pages">
      <section class="pdf-page" aria-label="Brand guidelines page">
        <iframe
          class="pdf-iframe"
          title="Brand guidelines PDF"
          src="{{ pdf_url }}#page=1&view=FitH"
        ></iframe>
      </section>
    </div>

    <div class="nav-arrows" id="navArrows" aria-label="Document navigation">
      <button id="prevPage" type="button" aria-label="Previous page">&lt;</button>
      <button id="nextPage" type="button" aria-label="Next page">&gt;</button>
    </div>
  </div>

  <noscript>
    <p>
      JavaScript is required to render this document inline.
      <a href="{{ pdf_url }}" target="_blank" rel="noopener noreferrer">Open the guidelines</a>.
    </p>
  </noscript>
</section>
{% endblock %}

{% block extra_scripts %}
<script type="module" src="{% static 'js/brand-guidelines.js' %}"></script>
{% endblock %}
