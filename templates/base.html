{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <link rel="preload" href="{% static 'fonts/PicNic.woff2' %}" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="{% static 'fonts/Velvelyne-Regular.woff2' %}" as="font" type="font/woff2" crossorigin>

  <title>{% block title %}Piffystudio{% endblock %}</title>

  <!-- CSS -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
  <link rel="stylesheet" href="{% static 'css/preloader.css' %}">
  <link rel="stylesheet" href="{% static 'css/main.css' %}">
  <link rel="stylesheet" href="{% static 'css/hero.css' %}">
  <link rel="stylesheet" href="{% static 'css/footer.css' %}">
  {% block extra_head %}{% endblock %}
</head>

<body class="d-flex flex-column min-vh-100 {% block body_class %}{% endblock %}">
  <!-- Preloader (CSS/JS animated text sequence) -->
  <div id="preloader" class="preloader no-video" aria-hidden="false">
    <div class="preloader-content">
      <div class="preloader-sequence" aria-hidden="true">
        <div class="preload-item item1">
          <span class="small"><span class="wiggle">build</span></span>
          <span class="big"><span class="wiggle">BUILD</span></span>
        </div>

        <div class="preload-item item2">
          <span class="small"><span class="wiggle">connect</span></span>
          <span class="big"><span class="wiggle">CONNECT</span></span>
        </div>

        <div class="preload-item item3">
          <span class="small"><span class="wiggle">create</span></span>
          <span class="big"><span class="wiggle">CREATE</span></span>
        </div>
      </div>
    </div>
  </div>

  <header>
    {% include "components/navbar.html" %}
  </header>

  <div class="site-content flex-grow-1">
    {% block content %}{% endblock %}
  </div>

  {% include "components/footer.html" %}

  <!-- JS -->
  <script src="{% static 'js/preloader.js' %}"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="{% static 'js/footer-prompt.js' %}"></script>
  <script src="{% static 'js/navbar.js' %}"></script>
  {% block extra_scripts %}{% endblock %}
</body>
</html>
