<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Dashboard{% endblock %}</title>
    {% load static %}

    <!-- Bootstrap -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">

    {% block extra_head %}
    <link rel="stylesheet" href="{% static 'css/dashboard.css' %}">
    {% endblock %}
</head>

<body>

    <!-- DASHBOARD TOP NAV -->
    <nav class="navbar navbar-dark bg-dark mb-4">
        <div class="container-fluid">
            <a class="navbar-brand" href="/accounts/dashboard/">Dashboard</a>

            <ul class="navbar-nav ms-auto d-flex align-items-center flex-row">
                <li class="nav-item dropdown">
                    <a class="nav-link dropdown-toggle text-white" href="#" id="shopDropdown" role="button" data-bs-toggle="dropdown" aria-expanded="false">
                        Shop
                    </a>
                    <ul class="dropdown-menu dropdown-menu-dark" aria-labelledby="shopDropdown">
                        <li><a class="dropdown-item" href="/shop/manage/products/">Products</a></li>
                        <li><a class="dropdown-item" href="/shop/manage/categories/">Categories</a></li>
                        <li><a class="dropdown-item" href="/shop/manage/orders/">Orders</a></li>
                    </ul>
                </li>

                <li class="nav-item dropdown ms-2">
                    <a class="nav-link dropdown-toggle text-white" href="#" id="contactDropdown" role="button" data-bs-toggle="dropdown" aria-expanded="false">
                        Contact
                    </a>
                    <ul class="dropdown-menu dropdown-menu-dark" aria-labelledby="contactDropdown">
                        <li><a class="dropdown-item" href="/accounts/messages/">Messages</a></li>
                        <li><a class="dropdown-item" href="/accounts/newsletter/">Newsletter</a></li>
                    </ul>
                </li>

                <li class="nav-item ms-3">
                    <a class="nav-link text-white" href="/accounts/logout/">Logout</a>
                </li>
            </ul>
        </div>
    </nav>

    <div class="container py-4">
        {% block content %}
        {% endblock %}
    </div>

</body>
<!-- include Bootstrap JS (bundle includes Popper) so dropdowns work -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</html>
